[mod-setting-description]
pam3-nvm2=Вимикає обладнання нічного бачення MK2, якщо встановлено прапорець.
pam3-esm3=Вимикає енергетичний щит МК3 та змінює рецепт екранованої сингулярності, якщо встановлено прапорець.
pam3-bm3=Вимикає особисту батарею МК3 та змінює рецепт силової броні MK4 і рецепт екранованої сингулярності, якщо встановлено прапорець.
pam3-sin=Вимикає екрановану сингулярність, якщо позначено.
pam3-pdd=Вимикає пасивну електророзрядну оборону якщо вказано.
pam3-pam4=Вимикає силову броню МК4, якщо позначено.
pam3-p4xl=Дозволяє встановити користувацькі розміри сітки силової броні МК4, якщо встановлено прапорець.
pam3-sgxl=Дозволяє встановити користувацькі розміри сітки павукотрона, якщо позначено.
pam3-inff=Вимикає сингулярний паливний елемент, якщо позначено. ПАЛИВО ВТРАЧАЄТЬСЯ, ЯКЩО ЗРУЙНУВАТИ БУДІВЛЮ!


